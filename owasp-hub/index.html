<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OWASP Top 10 — Training Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="wrap">
  <header class="masthead">
    <div>
      <p class="eyebrow">Internal training / self-study</p>
      <h1>OWASP Top 10 — Case Files</h1>
      <p class="sub">Click a category to open it. Each sub-vulnerability links to its own page with payloads, a quiz, and a checklist.</p>
    </div>
    <div class="tally" id="tally"></div>
  </header>

  <div class="grid" id="grid"></div>

  <footer class="note">
    <span class="status-line">10 categories · sub-vulnerability pages open in a new tab · dashboard stays open behind them</span>
    <span class="seal"><span class="monogram">SB</span> Made by SB</span>
  </footer>
</div>

<script src="data.js"></script>
<script>
  const grid = document.getElementById("grid");
  const tallyEl = document.getElementById("tally");

  let totalSubs = 0;
  let doneSubs = 0;

  OWASP_DATA.forEach((cat, i) => {
    const details = document.createElement("details");
    details.className = "case-file";
    if (i === 0) details.open = true; // first one expanded by default

    const catCount = cat.subs.length;
    const catDoneCount = cat.subs.filter(s => s.done).length;
    totalSubs += catCount;
    doneSubs += catDoneCount;

    details.innerHTML = `
      <summary>
        <span class="code-badge">${cat.code}</span>
        <div class="title-block">
          <h2>${cat.title}</h2>
          ${cat.note ? `<div class="note">${cat.note}</div>` : ""}
        </div>
        <span class="count-pill">${catDoneCount}/${catCount} pages</span>
        <span class="chevron">▶</span>
      </summary>
      <div class="sub-list">
        ${cat.subs.map(sub => renderSubRow(sub)).join("")}
      </div>
    `;

    grid.appendChild(details);
  });

  function renderSubRow(sub) {
    const dotClass = sub.conceptual ? "conceptual" : "";
    const countLabel = sub.count ? `${sub.count} sub-vulns` : (sub.conceptual ? "conceptual" : "");
    return `
      <a class="sub-row ${dotClass}" href="${sub.file}" target="_blank" rel="noopener">
        <span class="status-dot"></span>
        <span class="sub-name">
          ${sub.name}
          ${sub.note ? `<span class="sub-note">${sub.note}</span>` : ""}
        </span>
        ${countLabel ? `<span class="sub-count">${countLabel}</span>` : ""}
        <span class="go">OPEN →</span>
      </a>
    `;
  }

  tallyEl.innerHTML = `<strong>${doneSubs}/${totalSubs}</strong>pages linked`;

  // keep only one category open at a time
  document.querySelectorAll("details.case-file").forEach(el => {
    el.addEventListener("toggle", () => {
      if (el.open) {
        document.querySelectorAll("details.case-file").forEach(other => {
          if (other !== el) other.open = false;
        });
      }
    });
  });
</script>

</body>
</html>
