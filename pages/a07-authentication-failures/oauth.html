<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OAuth 2.0 Vulns — Exam & Recon Kit</title>
<style>
:root{
  --bg:#050015; --panel:#0a0220; --line:#1a0a3d;
  --text:#d0c0e6; --dim:#7a6a9a; --accent:#ff00ff; --bad:#ff4d4d;
  --mono:'JetBrains Mono','Fira Code','Consolas',monospace;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--mono);min-height:100vh;}
.wrap{max-width:720px;margin:0 auto;padding:32px 20px 60px;}
.tag{color:var(--accent);letter-spacing:.15em;font-size:12px;text-transform:uppercase;font-weight:bold;text-shadow:0 0 5px var(--accent);}
h1{font-size:22px;margin:6px 0 26px;color:#fff;text-shadow:0 0 8px rgba(255,0,255,0.3);}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:22px;}
.bar>div{height:100%;background:var(--accent);transition:width .3s;box-shadow:0 0 10px var(--accent);}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px;box-shadow:0 0 20px rgba(0,0,0,0.5);}
.qnum{color:var(--dim);font-size:12px;margin-bottom:10px;}
.qtext{font-size:16px;color:#fff;margin-bottom:18px;line-height:1.5;}
.opt{display:block;width:100%;text-align:left;background:#0e0614;border:1px solid var(--line);
  color:var(--text);padding:12px 14px;border-radius:7px;margin-bottom:10px;cursor:pointer;
  font-family:var(--mono);font-size:13.5px;transition:.15s;}
.opt:hover{border-color:var(--accent);background:#1a0a24;box-shadow:0 0 8px rgba(255,0,255,0.2);}
.opt.correct{background:#220a2a;border-color:var(--accent);color:var(--accent);text-shadow:0 0 5px var(--accent);}
.opt.wrong{background:#2a0a0a;border-color:var(--bad);color:var(--bad);text-shadow:0 0 5px var(--bad);}
.opt[disabled]{cursor:default;}
.score{color:var(--dim);font-size:13px;}
.center{text-align:center;}
.big{font-size:44px;color:var(--accent);margin:10px 0;text-shadow:0 0 15px var(--accent);}
.btn{background:var(--accent);color:#050015;border:none;padding:12px 20px;border-radius:7px;
  font-family:var(--mono);font-weight:bold;cursor:pointer;margin:6px 6px 0 0;font-size:13px;}
.btn.alt{background:transparent;border:1px solid var(--accent);color:var(--accent);box-shadow:0 0 5px rgba(255,0,255,0.3);}
.emoji{font-size:26px;position:fixed;top:-30px;animation:fall linear forwards;pointer-events:none;z-index:9999;text-shadow:0 0 10px var(--accent);}
@keyframes fall{to{transform:translateY(105vh) rotate(360deg);opacity:.2;}}
h2{color:#fff;font-size:15px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-top:30px;}
h3{color:var(--accent);font-size:14px;margin-top:20px;margin-bottom:5px;text-shadow:0 0 5px rgba(255,0,255,0.5);}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px;}
.chk input{margin-top:3px;accent-color:var(--accent);}
.chk.done label{color:var(--dim);text-decoration:line-through;}
pre{background:#0e0614;border:1px solid var(--line);border-radius:7px;padding:12px 14px;
  overflow-x:auto;font-size:12.5px;color:#f5e6ff;margin:8px 0 4px;box-shadow:inset 0 0 10px rgba(0,0,0,0.5);}
.pname{color:var(--accent);font-size:12.5px;margin-top:16px;}
#quizView,#kitView{display:none;}
.explain{margin-top:12px;padding:12px 14px;background:#0e0614;border:1px solid var(--line);
  border-radius:7px;font-size:13px;color:var(--dim);line-height:1.5;display:none;}
.explain b{color:var(--accent);}
.topbtn{margin-bottom:18px;}
#nextBtn{display:none;margin-top:16px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="tag">WVAPT // OAuth 2.0 Exploitation</div>
  <h1 id="pageTitle">Concept Check — 20 Questions</h1>

  <div id="quizView">
    <button class="btn alt topbtn" onclick="showKit()">Skip → Bug Bounty Checklist + Payloads</button>
    <div class="bar"><div id="prog" style="width:0%"></div></div>
    <div class="card">
      <div class="qnum"><span id="qIndex">1</span>/20 &nbsp;·&nbsp; <span class="score">score: <span id="scoreLive">0</span></span></div>
      <div class="qtext" id="qText"></div>
      <div id="opts"></div>
      <div class="explain" id="explain"></div>
      <button class="btn" id="nextBtn" onclick="goNext()">Next →</button>
    </div>
  </div>

  <div id="doneView" class="card center" style="display:none;">
    <div class="tag">Result</div>
    <div class="big"><span id="finalScore">0</span>/20</div>
    <div id="finalMsg" style="color:var(--dim);margin-bottom:16px;"></div>
    <button class="btn" onclick="restart()">Retake Exam</button>
    <button class="btn alt" onclick="showKit()">Bug Bounty Checklist + Payloads →</button>
  </div>

  <div id="kitView">
    <button class="btn alt" onclick="showQuiz()">← Back to Exam</button>

    <h2>Recon Checklist</h2>
    <div id="checklist"></div>

    <h2>Payload Cheatsheet</h2>
    <div id="payloads"></div>
  </div>
</div>

<script>
// Exam-level difficulty: All options are nearly identical in length to prevent guessing.
const Q=[
["What does OAuth 2.0 fundamentally provide?",["Authorization (granting limited access to data)","Authentication (proving who the user securely is)","Encryption of passwords stored in database now","Two-factor authentication for all users safely"],0,
"OAuth 2.0 is an authorization framework that allows third-party applications to obtain limited access to user accounts."],
["In the Authorization Code flow, what does the redirect_uri parameter control?",["Where the auth server sends the user back after login/consent","Which scopes are granted to the application locally","The exact expiry time of the access token globally","The cryptographic signing algorithm used safely"],0,
"The redirect_uri tells the authorization server where to send the user back with the authorization code."],
["What is the main security risk if redirect_uri validation only checks that the value starts with the registered domain?",["An attacker can register a lookalike domain to steal auth code","Tokens never expire and remain valid forever securely","The app becomes vulnerable to SQL injection attacks","The user's plaintext password gets exposed directly"],0,
"If validation only checks the prefix, attacker.com.real-app.com or real-app.com.evil.com can steal the code."],
["What is the purpose of the state parameter?",["To prove the callback genuinely originated from the client","To store the user's active session timeout securely locally","To specify which exact scopes are requested by the app","To encrypt the access token during transit securely now"],0,
"The state parameter prevents CSRF attacks by ensuring the callback corresponds to a request initiated by the client."],
["What happens if an app doesn't validate the state parameter, and an attacker sends the victim a completed OAuth callback URL using the attacker's own account?",["The attacker's third-party account gets linked to victim's app","The victim's entire account gets permanently deleted locally","The web application completely crashes instantly and fully","Nothing at all because state is not considered important"],0,
"The victim logs into the app, but the app binds the attacker's OAuth account to the victim's session, giving the attacker access."],
["How can an authorization code accidentally leak via the Referer header?",["If the callback page loads a third-party script or image","The code is securely stored in a cookie that anyone reads","The auth server logs the code publicly to the internet","The code is included in the page's HTML title tag safely"],0,
"If the callback URL (containing the code) loads external resources, the browser's Referer header sends the full URL to the third party."],
["What HTTP header setting helps prevent authorization code leakage via referrer?",["Referrer-Policy: no-referrer globally and completely","Content-Type: no-cache securely and locally now","X-Frame-Options: DENY completely and entirely always","Access-Control-Allow-Origin: * safely and securely"],0,
"Setting Referrer-Policy to no-referrer prevents the browser from sending the URL (and code) to third-party domains."],
["What does 'flawed scope validation' typically mean?",["A token issued for one purpose is accepted by a sensitive service","The application allows far too many login attempts locally","The application uses HTTP instead of HTTPS completely now","The client_secret is stored in plaintext locally entirely"],0,
"A token minted for a read-only audience is accepted by an admin service without checking the 'aud' or 'scope' claims."],
["What is 'scope upgrade' in the context of OAuth vulnerabilities?",["An attacker's app secretly obtaining a larger scope than approved","Upgrading the OAuth protocol version to the latest one","A user manually increasing their own permissions locally","The token's expiry time being extended indefinitely now"],0,
"The attacker requests a small scope, gets approval, but manipulates the token request to get broader access."],
["Why is the Implicit flow considered less secure than the Authorization Code flow?",["The access token is sent directly through the browser URL fragment","It does not use HTTPS encryption for the connection fully","It requires the user to enter a password every single time","It does not support the use of scopes at all whatsoever"],0,
"In Implicit flow, the token is exposed in the browser history and Referer headers, with no server-to-server exchange."],
["In the diagrams we reviewed, what does a dashed line represent?",["Server-to-server communication hidden from the browser","An optional step that can be skipped completely locally","A deprecated flow that should no longer be used globally","An encrypted cookie sent across the network securely"],0,
"Dashed lines represent back-channel communication that happens directly between servers, hidden from the browser."],
["What is the core problem with 'Improper implementation of the Implicit flow' (the login POST request bug)?",["The server trusts the username field in the login POST request","The token expires far too quickly for any real usage locally","The token is sent in plaintext over HTTP to the server now","The redirect_uri is missing entirely from the request fully"],0,
"The server trusts the user-supplied email/username without verifying it against the actual access token provided."],
["What do the /.well-known/oauth-authorization-server and /.well-known/openid-configuration endpoints typically expose?",["A JSON map of the OAuth/OIDC provider's supported endpoints","The user's highly sensitive personal data and passwords","The administrative panel login page for the application","A complete list of all registered users on the platform"],0,
"These discovery endpoints provide metadata about the provider's configuration, useful for reconnaissance."],
["What is PKCE (Proof Key for Code Exchange) designed to prevent?",["A stolen authorization code being exchanged by an attacker","Password reuse across multiple different websites locally","Cross-site scripting attacks executed in the browser now","Session timeout issues causing users to log out early"],0,
"PKCE ensures that even if an attacker steals the authorization code, they cannot exchange it without the secret verifier."],
["How does PKCE work at a high level?",["The client sends a hashed challenge openly, verifier secretly","The client encrypts the entire request with user password","The auth server emails a one-time code to the user safely","The client signs every request with a public key securely"],0,
"The client proves it is the legitimate initiator by sending the verifier matching the initial challenge at the token endpoint."],
["What is the purpose of OpenID Connect's id_token?",["To provide a signed, tamper-evident token proving identity","To replace the use of passwords entirely across all apps","To store the user's complete browsing history locally now","To encrypt the access token during network transmission"],0,
"The id_token is a JWT that contains claims about the authenticated user, proving their identity to the client."],
["How does an app verify that an id_token's signature is genuine?",["By fetching the provider's public key and checking signature","By asking the user to retype their password securely now","By comparing it against a local password database locally","By checking the exact file size of the token securely now"],0,
"The app fetches the JSON Web Key Set (JWKS) from the provider to cryptographically verify the token's signature."],
["What makes 'Dynamic Client Registration' risky if left unprotected?",["It allows anyone to register a new OAuth client with no auth","It allows any user to change their own password instantly","It disables HTTPS for all requests on the server locally","It permanently deletes user accounts from the database"],0,
"Without authentication on the registration endpoint, attackers can create malicious clients to interact with the auth server."],
["In the SSRF via OpenID dynamic client registration lab, which field was abused to trigger the server-side request?",["The logo_uri field inside the registration JSON payload","The redirect_uris field inside the registration payload","The client_secret field inside the registration payload","The token_endpoint_auth_method field in the payload"],0,
"The server attempted to fetch the image specified in logo_uri, allowing an attacker to point it to an internal IP."],
["Why could the attacker's own browser not reach 169.254.169.254 directly, but the OAuth server could?",["It is a special internal-only cloud metadata address reachable internally","The attacker didn't have Burp Suite configured properly now","The address requires a specific VPN to access securely fully","It was blocked by a firewall on the attacker's ISP locally"],0,
"The cloud metadata endpoint is only accessible from within the server's own network, allowing SSRF to exploit it."]
];

const CHECKLIST_DATA = [
  { title: "1. Endpoint Recon", items: [
    "Check <code>/.well-known/oauth-authorization-server</code> and <code>/.well-known/openid-configuration</code>.",
    "Identify supported flows (Authorization Code, Implicit, Dynamic Registration).",
    "Locate the <code>redirect_uri</code> handling and token endpoints."
  ]},
  { title: "2. redirect_uri Validation Bypass", items: [
    "Test prefix/suffix validation: <code>real-app.com.evil.com</code> or <code>evil.com/real-app.com</code>.",
    "Test path traversal: <code>real-app.com/../evil.com</code>.",
    "Check if arbitrary domains are accepted entirely."
  ]},
  { title: "3. State Parameter (CSRF)", items: [
    "Check if the <code>state</code> parameter is present and validated.",
    "If missing, craft a login CSRF: force the victim to complete an OAuth flow with the attacker's account."
  ]},
  { title: "4. Scope & Token Validation", items: [
    "Attempt scope upgrade: request small scope, modify token request for broader scope.",
    "Test implicit flow flaws: manipulate the <code>email</code> or <code>username</code> parameter in the login POST.",
    "Check if access tokens from other services are accepted (flawed <code>aud</code> validation)."
  ]},
  { title: "5. Dynamic Registration & SSRF", items: [
    "Test <code>/register</code> endpoint for open client registration.",
    "If open, register a client and inject internal IPs (e.g., <code>169.254.169.254</code>) into <code>logo_uri</code>.",
    "Monitor for SSRF responses or metadata leaks."
  ]}
];

const PAYLOADS = [
  { name: "1. redirect_uri Bypass", code: "redirect_uri=https://real-app.com.evil.com/callback\nredirect_uri=https://evil.com/real-app.com" },
  { name: "2. Login CSRF (Missing State)", code: "GET /callback?code=STOLEN_ATTACKER_CODE HTTP/1.1\n// Force victim to visit this URL to bind attacker's account" },
  { name: "3. Implicit Flow Account Takeover", code: "POST /authenticate HTTP/1.1\nemail=victim@target.com&token=ATTACKER_VALID_ACCESS_TOKEN" },
  { name: "4. Dynamic Registration SSRF", code: "POST /reg HTTP/1.1\n{\n  \"logo_uri\": \"http://169.254.169.254/latest/meta-data/\",\n  \"redirect_uris\": [\"https://evil.com\"]\n}" },
  { name: "5. Referer Leakage Fix", code: "Referrer-Policy: no-referrer\n// Add this to the callback page to prevent code leakage" }
];

let cur=0,score=0;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function renderQ(){
  document.getElementById('prog').style.width=(cur/Q.length*100)+'%';
  document.getElementById('qIndex').textContent=cur+1;
  document.getElementById('scoreLive').textContent=score;
  const [text,opts,correctIdx,why]=Q[cur];
  document.getElementById('qText').textContent=text;
  const exp=document.getElementById('explain');
  exp.style.display='none';exp.innerHTML='';
  let arr=opts.map((o,i)=>({o,correct:i===correctIdx}));
  shuffle(arr);
  const box=document.getElementById('opts');
  box.innerHTML='';
  arr.forEach(item=>{
    const b=document.createElement('button');
    b.className='opt';b.textContent=item.o;
    b.onclick=()=>pick(b,item.correct,box,item.o,why,arr);
    box.appendChild(b);
  });
  document.getElementById('nextBtn').style.display='none';
}

function pick(btn,isCorrect,box,pickedText,why,arr){
  [...box.children].forEach(c=>c.disabled=true);
  const exp=document.getElementById('explain');
  if(isCorrect){
    btn.classList.add('correct');score++;
    exp.innerHTML=`<b>Correct.</b> ${why}`;
  }else{
    btn.classList.add('wrong');
    const correctText=arr.find(a=>a.correct).o;
    [...box.children].forEach(c=>{if(c.textContent===correctText)c.classList.add('correct');});
    exp.innerHTML=`<b>Correct answer:</b> ${correctText}<br>${why}`;
  }
  exp.style.display='block';
  document.getElementById('scoreLive').textContent=score;
  const nb=document.getElementById('nextBtn');
  nb.style.display='inline-block';
  nb.textContent=(cur+1<Q.length)?'Next →':'See Results →';
}

function goNext(){
  cur++;
  if(cur<Q.length)renderQ();else finish();
}

function finish(){
  document.getElementById('prog').style.width='100%';
  document.getElementById('quizView').style.display='none';
  document.getElementById('doneView').style.display='block';
  document.getElementById('finalScore').textContent=score;
  const msg=score===20?"OAUTH BYPASSED. Identity fully assumed.":
    score>=15?"Solid grasp — revisit the weak spots.":
    score>=10?"Halfway there — reread the tricky sections.":
    "Go back through the concept steps before diving into labs.";
  document.getElementById('finalMsg').textContent=msg;
  if(score===20) confetti();
}

function confetti(){
  const em=['🌸','✨','🔓','🪄','💻'];
  for(let i=0;i<30;i++){
    setTimeout(()=>{
      const s=document.createElement('div');
      s.className='emoji';s.textContent=em[Math.floor(Math.random()*em.length)];
      s.style.left=Math.random()*100+'vw';
      s.style.animationDuration=(2+Math.random()*1.5)+'s';
      document.body.appendChild(s);
      setTimeout(()=>s.remove(),4000);
    },i*60);
  }
}

function restart(){
  cur=0;score=0;
  document.getElementById('doneView').style.display='none';
  document.getElementById('kitView').style.display='none';
  document.getElementById('quizView').style.display='block';
  document.getElementById('pageTitle').textContent='Concept Check — 20 Questions';
  renderQ();
}

let cameFromDone=false;
function showKit(){
  cameFromDone=document.getElementById('doneView').style.display==='block';
  document.getElementById('doneView').style.display='none';
  document.getElementById('quizView').style.display='none';
  document.getElementById('kitView').style.display='block';
  document.getElementById('pageTitle').textContent='Bug Bounty Recon Kit';
}
function showQuiz(){
  document.getElementById('kitView').style.display='none';
  if(cameFromDone){
    document.getElementById('doneView').style.display='block';
  }else{
    document.getElementById('quizView').style.display='block';
  }
  document.getElementById('pageTitle').textContent='Concept Check — 20 Questions';
}

function buildChecklist(){
  const c=document.getElementById('checklist');
  const saved=JSON.parse(localStorage.getItem('oauth_cyber_v1')||'{}');
  let html='';
  let idx=0;
  CHECKLIST_DATA.forEach(section => {
    html += `<h3>${section.title}</h3>`;
    section.items.forEach(item => {
      const isChecked = saved[idx] ? 'checked' : '';
      const isDone = saved[idx] ? ' done' : '';
      html += `<div class="chk${isDone}">
        <input type="checkbox" id="c${idx}" ${isChecked}>
        <label for="c${idx}">${item}</label>
      </div>`;
      idx++;
    });
  });
  c.innerHTML = html;
  
  idx=0;
  CHECKLIST_DATA.forEach(section => {
    section.items.forEach(item => {
      const checkbox = document.getElementById(`c${idx}`);
      const row = checkbox.parentElement;
      checkbox.onchange = e => {
        saved[idx] = e.target.checked;
        localStorage.setItem('oauth_cyber_v1', JSON.stringify(saved));
        row.classList.toggle('done', e.target.checked);
      };
      idx++;
    });
  });
}

function buildPayloads(){
  const p=document.getElementById('payloads');
  let html='';
  const esc = s => s.replace(/</g, '&lt;').replace(/>/g, '&gt;'); // Prevent live HTML execution
  PAYLOADS.forEach(item => {
    html += `<div class="pname">${item.name}</div><pre>${esc(item.code)}</pre>`;
  });
  p.innerHTML = html;
}

document.getElementById('quizView').style.display='block';
renderQ();
buildChecklist();
buildPayloads();
</script>
</body>
</html>
